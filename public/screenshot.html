<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>截图选择</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
    }

    #screenshot-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    #background-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
    }

    #selection {
      position: absolute;
      border: 2px solid #00a8ff;
      background: transparent;
      display: none;
      pointer-events: none;
    }

    #selection.active {
      display: block;
    }

    #selection-info {
      position: absolute;
      bottom: -28px;
      left: 0;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 4px 8px;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      border-radius: 4px;
      white-space: nowrap;
    }

    #hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 16px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      pointer-events: none;
      z-index: 1000;
    }

    #hint.hidden {
      display: none;
    }

    #countdown {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      color: white;
      padding: 40px 60px;
      border-radius: 16px;
      font-size: 48px;
      font-weight: bold;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      z-index: 2000;
      display: none;
    }

    #countdown.active {
      display: block;
    }

    #countdown-text {
      font-size: 16px;
      margin-top: 10px;
      text-align: center;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="screenshot-container">
    <img id="background-image" alt="Screenshot">
    <div id="overlay"></div>
    <div id="selection">
      <div id="selection-info"></div>
    </div>
    <div id="hint">拖拽选择截图区域，按 ESC 取消</div>
    <div id="countdown">
      <div id="countdown-number">3</div>
      <div id="countdown-text">请切换到目标窗口...</div>
    </div>
  </div>

  <script>
    const { ipcRenderer, desktopCapturer } = require('electron')

    let isSelecting = false
    let startX = 0
    let startY = 0
    let endX = 0
    let endY = 0
    let screenshotData = null

    const selection = document.getElementById('selection')
    const selectionInfo = document.getElementById('selection-info')
    const hint = document.getElementById('hint')
    const backgroundImage = document.getElementById('background-image')
    const countdown = document.getElementById('countdown')
    const countdownNumber = document.getElementById('countdown-number')

    async function captureScreen() {
      try {
        const sources = await desktopCapturer.getSources({
          types: ['screen'],
          thumbnailSize: {
            width: window.screen.width * window.devicePixelRatio,
            height: window.screen.height * window.devicePixelRatio
          }
        })

        if (sources.length > 0) {
          screenshotData = sources[0].thumbnail.toDataURL()
          backgroundImage.src = screenshotData
          return true
        }
        return false
      } catch (error) {
        console.error('获取屏幕截图失败:', error)
        return false
      }
    }

    async function startCountdown() {
      countdown.classList.add('active')
      hint.classList.add('hidden')

      let count = 3
      countdownNumber.textContent = count

      const interval = setInterval(() => {
        count--
        if (count > 0) {
          countdownNumber.textContent = count
        } else {
          clearInterval(interval)
          countdown.classList.remove('active')
          captureScreen().then(success => {
            if (success) {
              hint.classList.remove('hidden')
            } else {
              ipcRenderer.send('screenshot-cancelled')
            }
          })
        }
      }, 1000)
    }

    function updateSelection() {
      const x = Math.min(startX, endX)
      const y = Math.min(startY, endY)
      const width = Math.abs(endX - startX)
      const height = Math.abs(endY - startY)

      selection.style.left = x + 'px'
      selection.style.top = y + 'px'
      selection.style.width = width + 'px'
      selection.style.height = height + 'px'

      selectionInfo.textContent = `${width} x ${height}`
    }

    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0 || !screenshotData) return

      hint.classList.add('hidden')
      isSelecting = true
      startX = e.clientX
      startY = e.clientY
      endX = e.clientX
      endY = e.clientY

      selection.classList.add('active')
      updateSelection()
    })

    document.addEventListener('mousemove', (e) => {
      if (!isSelecting) return

      endX = e.clientX
      endY = e.clientY
      updateSelection()
    })

    document.addEventListener('mouseup', async (e) => {
      if (!isSelecting) return
      isSelecting = false

      const x = Math.min(startX, endX)
      const y = Math.min(startY, endY)
      const width = Math.abs(endX - startX)
      const height = Math.abs(endY - startY)

      if (width < 5 || height < 5) {
        selection.classList.remove('active')
        hint.classList.remove('hidden')
        return
      }

      try {
        const img = new Image()
        img.src = screenshotData

        await new Promise((resolve) => {
          img.onload = resolve
        })

        const canvas = document.createElement('canvas')
        const ctx = canvas.getContext('2d')

        const scale = window.devicePixelRatio
        canvas.width = width * scale
        canvas.height = height * scale

        ctx.drawImage(
          img,
          x * scale,
          y * scale,
          width * scale,
          height * scale,
          0,
          0,
          width * scale,
          height * scale
        )

        const croppedData = canvas.toDataURL('image/png')
        ipcRenderer.send('screenshot-selected', croppedData)
      } catch (error) {
        console.error('截图失败:', error)
        ipcRenderer.send('screenshot-cancelled')
      }
    })

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        ipcRenderer.send('screenshot-cancelled')
      }
    })

    startCountdown()
  </script>
</body>
</html>
